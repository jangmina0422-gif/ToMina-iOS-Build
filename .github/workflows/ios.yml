name: Build To.Mina core 0.1.22
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack public source
        run: |
          echo 'b436152e388d63c5d8bb28afb8c2069d73d1fda4f92f30d58232beab3e0816a7  ToMina-iOS-free-build-0.1.22.zip' | shasum -a 256 -c -
          mkdir source
          unzip -q ToMina-iOS-free-build-0.1.22.zip -d source
      - name: Prepare project
        working-directory: source
        run: |
          brew install xcodegen
          sips -s format png -z 1024 1024 Resources/IconSource.png --out Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Verify original save and empty layouts
        working-directory: source
        run: |
          xcrun simctl list devices available -j > devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("devices.json"))["devices"]; print(next(v["udid"] for k in sorted(d,key=lambda k:("iOS-18-" in k,k),reverse=True) for v in d[k] if "iOS" in k and "iPad" in v["name"] and v.get("isAvailable")))')
          xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath simulator-build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Build unsigned core
        working-directory: source
        run: xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify empty accounts and package
        working-directory: source
        run: |
          APP=build/Build/Products/Release-iphoneos/ToMina.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = '0.1.22'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = '23'
          python3 -c 'import json; assert json.load(open("build/Build/Products/Release-iphoneos/ToMina.app/Credentials.json"))["hashes"] == []'
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qr To.Mina-0.1.22-build23-core-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: To.Mina-0.1.22-build23-core
          path: source/dist/To.Mina-0.1.22-build23-core-unsigned.ipa
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: To.Mina-0.1.22-build23-core-test-results
          path: source/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 2
