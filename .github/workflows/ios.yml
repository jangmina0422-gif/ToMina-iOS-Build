name: Build To.Mina core 0.1.38
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack public source
        run: |
          echo '8240b773d0235026662221f8c120fd10e99008512bdbbb17a2d0e016a944c307  ToMina-iOS-free-build-0.1.38.zip' | shasum -a 256 -c -
          mkdir source
          unzip -q ToMina-iOS-free-build-0.1.38.zip -d source
      - name: Prepare project
        working-directory: source
        run: |
          brew install xcodegen
          sips -s format png -z 1024 1024 Resources/IconSource.png --out Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Verify preview performance and original documents
        working-directory: source
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list devices available -j > devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("devices.json"))["devices"]; print(next(v["udid"] for k in sorted(d,key=lambda k:("iOS-18-" in k,k),reverse=True) for v in d[k] if "iOS" in k and "iPad" in v["name"] and v.get("isAvailable")))')
          echo "EDITOR_TEST_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath simulator-build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:ToMinaTests test
      - name: Build unsigned core
        working-directory: source
        run: xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify empty accounts and package
        working-directory: source
        run: |
          APP=build/Build/Products/Release-iphoneos/ToMina.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = '0.1.38'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = '39'
          test "$(/usr/libexec/PlistBuddy -c 'Print UIFileSharingEnabled' "$APP/Info.plist")" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$APP/Info.plist")" = '18.0'
          python3 -c 'import json; assert json.load(open("build/Build/Products/Release-iphoneos/ToMina.app/Credentials.json"))["hashes"] == []'
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qr To.Mina-0.1.38-build39-core-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: To.Mina-0.1.38-build39-core
          path: source/dist/To.Mina-0.1.38-build39-core-unsigned.ipa
          retention-days: 2
      - name: Verify actual editor controls
        working-directory: source
        timeout-minutes: 15
        run: xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Debug -destination "platform=iOS Simulator,id=$EDITOR_TEST_DEVICE" -parallel-testing-enabled NO -derivedDataPath simulator-build -resultBundlePath EditorUIResults.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:ToMinaUITests/EditorControlsUITests/testJumpToLastLineOpensSourceAndPreservesLongDraft -only-testing:ToMinaUITests/EditorControlsUITests/testJumpToLastLineKeepsAnimationEditorAndDraft -only-testing:ToMinaUITests/EditorControlsUITests/testEditorActionsRemainHittableWithKeyboardAndLandscape -only-testing:ToMinaUITests/EditorControlsUITests/testINIEditorHasOneVisibleExitAndCanReturn -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 test
      - name: Export editor UI screenshots
        working-directory: source
        if: always()
        run: |
          mkdir -p ui-proof
          xcrun xcresulttool export attachments --path EditorUIResults.xcresult --output-path ui-proof
          xcrun xcresulttool get test-results summary --path EditorUIResults.xcresult --compact > ui-proof/test-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: To.Mina-0.1.38-editor-ui-proof
          path: source/ui-proof
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: To.Mina-0.1.38-build39-core-test-results
          path: source/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 2
