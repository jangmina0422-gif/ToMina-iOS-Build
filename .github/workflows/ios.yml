name: Build To.Mina core 0.1.37
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: preview-screen-037
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack public source
        run: |
          echo '49abd715c83aa38d67ae8a0e3c0b7874be249bc2cc3a2dc7cac375de1c8657cb  ToMina-iOS-free-build-0.1.37.zip' | shasum -a 256 -c -
          mkdir source
          unzip -q ToMina-iOS-free-build-0.1.37.zip -d source
      - name: Prepare project
        working-directory: source
        run: |
          brew install xcodegen
          sips -s format png -z 1024 1024 Resources/IconSource.png --out Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Prepare editor simulator
        working-directory: source
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list devices available -j > devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("devices.json"))["devices"]; print(next(v["udid"] for k in sorted(d,key=lambda k:("iOS-18-" in k,k),reverse=True) for v in d[k] if "iOS" in k and "iPad" in v["name"] and v.get("isAvailable")))')
          echo "EDITOR_TEST_DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Verify actual editor controls
        working-directory: source
        timeout-minutes: 15
        run: xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Debug -destination "platform=iOS Simulator,id=$EDITOR_TEST_DEVICE" -parallel-testing-enabled NO -derivedDataPath simulator-build -resultBundlePath EditorUIResults.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:ToMinaUITests/EditorControlsUITests/testTopBarAndKeyboardRemainVisibleThroughAnimationAndBarEditing -only-testing:ToMinaUITests/EditorControlsUITests/testNarrowPreviewAndSoftwareKeyboardKeepTopBarAndBottomRowVisible -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 test
      - name: Export editor UI screenshots
        working-directory: source
        if: always()
        run: |
          mkdir -p ui-proof
          xcrun xcresulttool export attachments --path EditorUIResults.xcresult --output-path ui-proof
          xcrun xcresulttool get test-results summary --path EditorUIResults.xcresult --compact > ui-proof/test-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: To.Mina-0.1.37-editor-ui-proof
          path: source/ui-proof
          if-no-files-found: ignore
          retention-days: 2
