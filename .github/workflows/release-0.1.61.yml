name: Build and verify To.Mina 0.1.61 toolbox, fixed editor and half-BDA
on:
  push:
    branches: [claude/to-mina-ipa-apk-xgyeug]
    paths: [ToMina-iOS-free-build-0.1.61.zip, .github/workflows/release-0.1.61.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-0.1.61
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify sanitized input and generate project
        run: |
          echo 'bfbe30a4eb122e4b1a121edc15b146ac8f4f23eb5ce05dc5f003b1714a4535dc  ToMina-iOS-free-build-0.1.61.zip' | shasum -a 256 -c -
          unzip -q ToMina-iOS-free-build-0.1.61.zip -d source
          brew install xcodegen
          cd source
          sips -s format png -z 1024 1024 Resources/IconSource.png --out Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Build and verify unsigned core
        working-directory: source
        run: |
          xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > release-build.log 2>&1 || { tail -n 100 release-build.log; exit 1; }
          APP=build/Build/Products/Release-iphoneos/ToMina.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = '0.1.61'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = '62'
          test "$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$APP/Info.plist")" = '18.0'
          python3 -c 'import json; assert json.load(open("build/Build/Products/Release-iphoneos/ToMina.app/Credentials.json"))["hashes"] == []'
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qr To.Mina-0.1.61-core.ipa Payload
      - name: Preserve the sanitized core for local resource assembly
        run: |
          mkdir -p build-output-0.1.61
          cp source/dist/To.Mina-0.1.61-core.ipa build-output-0.1.61/
          shasum -a 256 build-output-0.1.61/To.Mina-0.1.61-core.ipa > build-output-0.1.61/SHA256SUMS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-output-0.1.61
          git commit -m 'Preserve sanitized iOS 0.1.61 core for local resource assembly [skip ci]'
          git pull --rebase origin claude/to-mina-ipa-apk-xgyeug && git push origin HEAD:claude/to-mina-ipa-apk-xgyeug
      - name: Prepare iPad simulator
        working-directory: source
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list devices available -j > devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("devices.json"))["devices"]; print(next(v["udid"] for k in sorted(d,key=lambda k:("iOS-18-" in k,k),reverse=True) for v in d[k] if "iOS" in k and "iPad" in v["name"] and v.get("isAvailable")))')
          echo "EDITOR_TEST_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Verify archive operations, CSS, source editing, session state and GIF export
        working-directory: source
        run: |
          xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Debug -destination "platform=iOS Simulator,id=$EDITOR_TEST_DEVICE" -parallel-testing-enabled NO -derivedDataPath simulator-build -resultBundlePath AuditResults.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:ToMinaTests/CombinedPreviewTests -only-testing:ToMinaTests/HalfBdaUpdateTests -only-testing:ToMinaTests/PreviewPerformanceTests -only-testing:ToMinaTests/SourceLineTests test > native-tests.log 2>&1 || { tail -n 100 native-tests.log; exit 1; }
      - name: Verify portrait, landscape and keyboard editing
        if: always()
        working-directory: source
        run: |
          xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Debug -destination "platform=iOS Simulator,id=$EDITOR_TEST_DEVICE" -parallel-testing-enabled NO -derivedDataPath simulator-build -resultBundlePath EditorResults.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:ToMinaUITests/EditorControlsUITests/testPreviewAndSourceFramesStayFixedAcrossKeyboardAndRotation -only-testing:ToMinaUITests/EditorControlsUITests/testModesMoveToHeaderAndToolboxHasOneCleanup -only-testing:ToMinaUITests/EditorControlsUITests/testArchiveFolderActionsHaveSpacingAndStayInsideSheet -only-testing:ToMinaUITests/EditorControlsUITests/testHalfBdaToolExplainsOrdinaryBdsAndBdi -only-testing:ToMinaUITests/EditorControlsUITests/testPortraitSourcePaneCompactsDetailsAboveEditor -only-testing:ToMinaUITests/EditorControlsUITests/testLandscapeSourcePaneUsesHeightWithoutBlankDetailsBlock -only-testing:ToMinaUITests/EditorControlsUITests/testAddKeyAndNewCSSStyleFieldsInSource -only-testing:ToMinaUITests/EditorControlsUITests/testCSSCleanupFromToolboxClosesSheetKeepsStylesAndSupportsUndo -only-testing:ToMinaUITests/EditorControlsUITests/testSingleGIFAppliesToPreviewWithoutOpeningExport -only-testing:ToMinaUITests/EditorControlsUITests/testFloatingButtonsHaveEqualFramesIncludingMenuAndPauseState -only-testing:ToMinaUITests/EditorControlsUITests/testLandscapeSearchAndMenuVersion -only-testing:ToMinaUITests/EditorControlsUITests/testSourceOpensDirectlyAndPlaintextLivesInToolbox test > editor-tests.log 2>&1 || { tail -n 100 editor-tests.log; exit 1; }
      - name: Export test evidence
        if: always()
        working-directory: source
        run: |
          mkdir -p proof
          for RESULT in AuditResults EditorResults; do
            if test -d "$RESULT.xcresult"; then
              xcrun xcresulttool get test-results summary --path "$RESULT.xcresult" --compact > "proof/$RESULT-summary.json"
              xcrun xcresulttool export attachments --path "$RESULT.xcresult" --output-path "proof/$RESULT"
            fi
          done
          python3 - <<'PY'
          import json,pathlib
          for p in pathlib.Path('proof').glob('*-summary.json'):
              print(json.dumps({'file':p.name,'summary':json.loads(p.read_text())}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: To.Mina-0.1.61-proof
          path: |
            source/proof
            source/*-tests.log
            source/release-build.log
            source/dist/To.Mina-0.1.61-core.ipa
          retention-days: 14
      - name: Preserve synthetic audit regression evidence and summaries
        if: always()
        run: |
          mkdir -p build-output-0.1.61/proof
          if test -d source/proof; then
            cp -R source/proof/. build-output-0.1.61/proof/
          fi
          git add build-output-0.1.61
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve synthetic audit regression verification evidence [skip ci]'
            git pull --rebase origin claude/to-mina-ipa-apk-xgyeug && git push origin HEAD:claude/to-mina-ipa-apk-xgyeug
          fi