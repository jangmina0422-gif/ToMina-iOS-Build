name: Build and verify To.Mina editor 0.1.55
on:
  workflow_dispatch:
  push:
    branches: [codex/css-icons-public-0.1.55]
    paths:
      - ToMina-iOS-free-build-0.1.55.zip
      - .github/workflows/editor-workspace.yml
permissions:
  contents: read
concurrency:
  group: editor-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and generate project
        run: |
          echo 'facde76d6e667a90ee9c169626352a0a807a2a053c587c49a3fecf52cf53f493  ToMina-iOS-free-build-0.1.55.zip' | shasum -a 256 -c -
          mkdir source
          unzip -q ToMina-iOS-free-build-0.1.55.zip -d source
          brew install xcodegen
          cd source
          sips -s format png -z 1024 1024 Resources/IconSource.png --out Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Build unsigned IPA
        working-directory: source
        run: |
          xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > release-build.log 2>&1 || { tail -n 100 release-build.log; exit 1; }
          APP=build/Build/Products/Release-iphoneos/ToMina.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = '0.1.55'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = '56'
          python3 -c 'import json; assert json.load(open("build/Build/Products/Release-iphoneos/ToMina.app/Credentials.json"))["hashes"] == []'
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qr To.Mina-0.1.55-core.ipa Payload
          shasum -a 256 To.Mina-0.1.55-core.ipa > SHA256SUMS
      - name: Prepare simulator
        working-directory: source
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list devices available -j > devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("devices.json"))["devices"]; print(next(v["udid"] for k in sorted(d,key=lambda k:("iOS-18-" in k,k),reverse=True) for v in d[k] if "iOS" in k and "iPad" in v["name"] and v.get("isAvailable")))')
          echo "EDITOR_TEST_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Verify draft persistence and field editing
        working-directory: source
        run: |
          xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Debug -destination "platform=iOS Simulator,id=$EDITOR_TEST_DEVICE" -parallel-testing-enabled NO -derivedDataPath simulator-build -resultBundlePath NativeResults.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:ToMinaTests/CSSCleanupTests -only-testing:ToMinaTests/EditorInteractionTests -only-testing:ToMinaTests/EditorPerformanceTests -only-testing:ToMinaTests/SourceLineTests -only-testing:ToMinaTests/TemplateEditsTests test > native-tests.log 2>&1 || { tail -n 100 native-tests.log; exit 1; }
      - name: Verify editor interface
        working-directory: source
        timeout-minutes: 18
        run: |
          xcodebuild -project ToMina.xcodeproj -scheme ToMina -configuration Debug -destination "platform=iOS Simulator,id=$EDITOR_TEST_DEVICE" -parallel-testing-enabled NO -derivedDataPath simulator-build -resultBundlePath EditorUIResults.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:ToMinaUITests/EditorControlsUITests/testSourceOpensDirectlyAndPlaintextLivesInToolbox -only-testing:ToMinaUITests/EditorControlsUITests/testSourceEditingKeepsOnlyPreviewAndEditorAcrossRotation -only-testing:ToMinaUITests/EditorControlsUITests/testAddKeyAndNewCSSStyleFieldsInSource -only-testing:ToMinaUITests/EditorControlsUITests/testSourceLinePositionTracksEditingAndEndNavigation -only-testing:ToMinaUITests/EditorControlsUITests/testNarrowPreviewAndSoftwareKeyboardKeepTopBarAndBottomRowVisible -only-testing:ToMinaUITests/EditorControlsUITests/testCSSCleanupFromToolboxClosesSheetKeepsStylesAndSupportsUndo -only-testing:ToMinaUITests/EditorControlsUITests/testToolboxCleanupWithMultipleCSSWaitsForSelectionAndCanCancel -only-testing:ToMinaUITests/EditorControlsUITests/testCSSCleanupMenuClearsUnusedBodyKeepsHeaderAndUndoRestoresIt -only-testing:ToMinaUITests/EditorControlsUITests/testCSSCleanupCanBeOpenedFromINIMenu -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 test > editor-ui-tests.log 2>&1 || { tail -n 100 editor-ui-tests.log; exit 1; }
      - name: Export test proof
        if: always()
        working-directory: source
        run: |
          mkdir -p proof
          for RESULT in NativeResults EditorUIResults; do
            if test -d "$RESULT.xcresult"; then
              xcrun xcresulttool get test-results summary --path "$RESULT.xcresult" --compact > "proof/$RESULT-summary.json"
              xcrun xcresulttool export attachments --path "$RESULT.xcresult" --output-path "proof/$RESULT"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: To.Mina-0.1.55-build56-core-unsigned
          path: source/dist/*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: To.Mina-0.1.55-editor-proof
          path: |
            source/proof
            source/*-tests.log
            source/release-build.log
          if-no-files-found: ignore
          retention-days: 14
