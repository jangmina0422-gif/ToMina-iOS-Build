name: Preview diagnostics Android 56 and iOS 47
on:
  push:
    branches: [preview-diagnostics]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unpack checked test inputs
        run: |
          echo '52f57df67ce73d946fb7d7e78649ecdab07f05920128c6d26a78e56b93337ebd  preview-diagnostics-56-47.zip' | sha256sum -c -
          unzip -q preview-diagnostics-56-47.zip -d probe
          python3 - <<'PY'
          from pathlib import Path
          p=Path('probe/build_ci.py')
          p.write_text(p.read_text().replace('for name in old.namelist():new.writestr(name,old.read(name))','for info in old.infolist():new.writestr(info,old.read(info.filename))'))
          PY
      - name: Enable test VM acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: cd probe && python3 build_ci.py && bash run_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-56-preview-proof
          path: probe/proof
          retention-days: 7
